<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Display</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f9f9; padding: 40px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; padding: 15px; text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
        .card h3 { margin: 10px 0 5px; color: #333; }
        .price { font-weight: bold; color: #2ecc71; }
        .category { font-size: 0.8rem; color: #7f8c8d; text-transform: uppercase; }
    </style>
</head>
<body>

    <h1>Our Menu</h1>
    <div id="menu" class="menu-grid">Loading menu items...</div>

    <script>
        async function fetchMenu() {
            const menuContainer = document.getElementById('menu');
            
            try {
                console.log('Fetching DataBase.json...');
                const response = await fetch('DataBase.json');
                console.log('Response status:', response.status);
                if (!response.ok) throw new Error('Failed to load database');
                
                const data = await response.json();
                console.log('Parsed data:', data);
                console.log('data.Data:', data.Data);
                menuContainer.innerHTML = ''; // Clear loading text

                // Accessing the "Data" array from your JSON
                if (!data.Data) {
                    throw new Error('Data.Data is undefined');
                }
                data.Data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    card.innerHTML = `
                        <img src="${item.img}" alt="${item.Name}">
                        <p class="category">${item.Catagory}</p>
                        <h3>${item.Name}</h3>
                        <p>${item.desc}</p>
                        <p class="price">${item.Price}</p>
                    `;

                    menuContainer.appendChild(card);
                });

            } catch (error) {
                console.error('Error details:', error);
                menuContainer.innerHTML = `<p style="color:red">Error: ${error.message}</p><p style="color:gray; font-size:12px">Check browser console (F12) for more details</p>`;
            }
        }

        fetchMenu();
    </script>
</body>
</html>
